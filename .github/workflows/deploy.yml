name: deploy

on:
  push:
    tags:
      - '**'
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - name: Set up JDK 21
        uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1
        with:
          java-version: 21
      - name: Login to DockerHub Registry
        run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
      - name: Create docker image tag name with github release name
        id: vars
        run: echo ::set-output name=tag::$(echo ${GITHUB_REF:10})
      - name: Build image
        run: docker build --secret id=github_token,env=GITHUB_TOKEN --secret id=github_username,env=GITHUB_USERNAME . --file Dockerfile --tag jugirard/transactions-sync-process:${{steps.vars.outputs.tag}} --tag jugirard/transactions-sync-process:latest
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker Image
        run: docker push jugirard/transactions-sync-process:${{steps.vars.outputs.tag}}
      - name: Push Docker Image latest tag
        run: docker push jugirard/transactions-sync-process:latest
      - name: Docker logout
        run: docker logout

